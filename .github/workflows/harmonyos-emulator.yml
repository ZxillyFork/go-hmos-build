name: HarmonyOS x64 emulator runtime

on:
  push:
    branches: [ci/harmonyos-amd64]
    paths-ignore:
      - '.github/workflows/harmonyos-app-network.yml'
      - 'scripts/app/**'
      - 'scripts/build-app-tests.sh'
      - 'testdata/app-host/**'
      - 'testdata/app-network/**'
      - 'tests/test_app_network.py'
      - 'README.md'
      - 'VALIDATION.md'
      - '.gitignore'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: harmonyos-amd64-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  GOENV: 'off'
  GOTOOLCHAIN: local

jobs:
  runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      GO_SOURCE_ROOT: ${{ github.workspace }}/source
      GO_HMOS_CACHE_ROOT: ${{ github.workspace }}/.cache
      SDK_DOWNLOAD_DIR: ${{ github.workspace }}/.sdk
      # This immutable package's agreements were already accepted in the owner's
      # cjv run 37875586125. Any package update needs a fresh license review.
      HARMONYOS_ACCEPTED_CLI_SHA256: 58da7359019e9360a8bb82da0cd1d3b3b26fedc338379f257849f2162e3ac1fc
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Check scripts and pin the core revision
        id: source
        run: |
          for script in scripts/*.sh; do bash -n "$script"; done
          python3 -m unittest discover -s tests -v
          python3 -m unittest discover -s testdata/emulator -p "test_*.py" -v
          printf 'core_sha=%s\n' "$(python3 scripts/source-pin.py)" >> "$GITHUB_OUTPUT"
          printf 'EMULATOR_ROOT=%s/go-hmos-emulator\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - name: Verify actual KVM VM creation
        run: |
          # Give only this process the runner's existing kvm group. Do not alter
          # device modes, ACLs, group membership, or system security settings.
          sudo -E env HOME="$HOME" USER="$USER" LOGNAME="$LOGNAME" setpriv --reuid="$(id -u)" --regid="$(getent group kvm | cut -d: -f3)" \
            --init-groups --inh-caps=-all --bounding-set=-all python3 scripts/emulator/run.py hardware
      - name: Install official emulator dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libatomic1 libpulse0 libegl1 \
            libgbm1 libgl1 libpng16-16 libfontconfig1 libfreetype6 libxcb-icccm4 \
            libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 \
            libxcb-shape0 libxcb-xinerama0 libxcb-xkb1 libsm6 libice6 \
            libxkbcommon-x11-0 libxkbcommon0 libglib2.0-0
      - name: Download checksum-pinned Huawei CLI 26.0.0.821
        run: python3 scripts/emulator/run.py download
      - name: Install official HarmonyOS 6.1.1 API 24 PC image
        run: python3 scripts/emulator/run.py install
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ZxillyFork/go-hmos
          ref: ${{ steps.source.outputs.core_sha }}
          path: source
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: 1.27.2
          cache: false
      - name: Bootstrap exact core revision
        env:
          EXPECTED_SHA: ${{ steps.source.outputs.core_sha }}
        run: |
          test "$(git -C "$GO_SOURCE_ROOT" rev-parse HEAD)" = "$EXPECTED_SHA"
          bash scripts/bootstrap.sh
      - name: Build actual OpenHarmony amd64 payload with public SDK 6.1
        run: |
          bash scripts/download-sdk.sh
          export OHOS_NDK_HOME="$(cat "$SDK_DOWNLOAD_DIR/native-path.txt")"
          GOARCH=amd64 BUILD_NATIVE_TOOLS=0 bash scripts/build.sh
          export GOOS=openharmony GOARCH=amd64 CGO_ENABLED=1
          export CC="$OHOS_NDK_HOME/llvm/bin/clang --target=x86_64-linux-ohos --sysroot=$OHOS_NDK_HOME/sysroot"
          (cd "$GO_SOURCE_ROOT/src/runtime/testdata/testprog" && "$GO_SOURCE_ROOT/bin/go" build -o "$GITHUB_WORKSPACE/openharmony-out/amd64/testprog" .)
          $CC -O2 -fPIE -pie testdata/system-config/native.c -ldl -o openharmony-out/amd64/system-native
          cp "$SDK_DOWNLOAD_DIR/sdk.sha256" "$SDK_DOWNLOAD_DIR/sdk-url.txt" openharmony-out/amd64/
      - name: Build standalone executables without cgo or an external linker
        run: |
          export GOOS=openharmony CGO_ENABLED=0 CC=/nonexistent
          for arch in amd64 arm64; do
            export GOARCH="$arch"
            out="$GITHUB_WORKSPACE/openharmony-out/$arch"
            mkdir -p "$out"
            "$GO_SOURCE_ROOT/bin/go" build -o "$out/standalone-hello" "$GO_SOURCE_ROOT/src/cmd/cgo/internal/testcshared/testdata/openharmony/hello/main.go"
            "$GO_SOURCE_ROOT/bin/go" build -o "$out/standalone-go" cmd/go
            (cd "$GO_SOURCE_ROOT/src/runtime/testdata/testprog" && "$GO_SOURCE_ROOT/bin/go" build -o "$out/standalone-testprog" .)
            "$GO_SOURCE_ROOT/bin/go" test -c -o "$out/standalone-runtime.test" runtime
            "$GO_SOURCE_ROOT/bin/go" build -o "$out/system-config" testdata/system-config/main.go
            "$GO_SOURCE_ROOT/bin/go" test -c -o "$out/system-net.test" net
            "$GO_SOURCE_ROOT/bin/go" test -c -tags=timetzdata -o "$out/system-time.test" time
            for name in standalone-hello standalone-go standalone-testprog standalone-runtime.test system-config system-net.test system-time.test; do
              readelf -h -l -d "$out/$name" > "$out/$name.elf.txt"
              grep -Eq 'Type:.*EXEC' "$out/$name.elf.txt"
              if grep -Eq 'INTERP|DYNAMIC|NEEDED' "$out/$name.elf.txt"; then
                echo "Unexpected dynamic dependency: $arch/$name" >&2
                exit 1
              fi
            done
          done
      - name: Run upstream preemption programs in the official emulator
        run: |
          cat > scripts/emulator/preempt-check.py <<'PY'
          import os
          import json
          from pathlib import Path
          import run

          def check(self, payload):
              payload = Path(payload)
              self.shell("prepare", f"mkdir -p {run.GUEST}")
              for name in ("testprog", "runtime.test", "loader", "libgo_hmos_test.so", "standalone-hello", "standalone-go", "standalone-testprog", "standalone-runtime.test", "system-config", "system-native", "system-net.test", "system-time.test"):
                  self.run("send-" + name, [self.tools / "hdc", "-t", run.TARGET, "file", "send", payload / name, run.GUEST + "/" + name], env=self.env())
                  self.shell("verify-" + name, f"cd {run.GUEST} && test \"$(sha256sum {name} | cut -d ' ' -f 1)\" = {run.digest(payload / name)} && chmod 755 {name}")
              prefix = f"cd {run.GUEST} && "
              self.shell("system-layout", "param get persist.time.timezone; ls -l /dev/__parameters__/u:object_r:time_param:s0 /etc/localtime /etc/resolv.conf /dev/unix/socket/dnsproxyd; ls /etc/security/certificates | wc -l", check=False)
              _, native_output = self.shell("system-native", prefix + "unset TZ; ./system-native", timeout=45)
              _, go_output = self.shell("system-config", prefix + "unset TZ; ./system-config", timeout=45)
              native = {}
              for line in native_output.splitlines():
                  if "=" in line:
                      key, value = line.split("=", 1)
                      native.setdefault(key, []).append(value)
              report = next(json.loads(line) for line in go_output.splitlines() if line.startswith('{"'))
              if report["offset"] != int(native["offset"][0]):
                  raise run.Failure("Go local timezone differs from libc")
              if report.get("roots", 0) < 1:
                  raise run.Failure("no system roots loaded")
              if native.get("username") and report.get("username") != native["username"][0]:
                  raise run.Failure("Go user lookup differs from libc")
              if native.get("dns_status") == ["0"]:
                  expected = sorted(("["+addr+"]" if ":" in addr else addr)+":53" for addr in native.get("dns_server", []))
                  if report["dns_servers"] != expected:
                      raise run.Failure("Go DNS configuration differs from NetSys")
              else:
                  raise run.Failure("NetSys did not provide DNS configuration")
              if native.get("interfaces_status") == ["0"] and report["interfaces"] != sorted(set(native.get("interface", []))):
                  raise run.Failure("Go interface discovery differs from libc")
              self.shell("system-net-tests", prefix + "./system-net.test -test.v -test.timeout=30s -test.run='^TestOpenHarmonyDNSConfig$'")
              self.shell("system-time-tests", prefix + "./system-time.test -test.v -test.timeout=30s -test.run='^TestOpenHarmony(SystemTimeZone|PackedZones)$'")
              _, output = self.shell("standalone-hello", prefix + "./standalone-hello")
              if "openharmony/amd64 (runtime.GOOS=openharmony)" not in output:
                  raise run.Failure("standalone executable has the wrong identity")
              _, output = self.shell("standalone-go", prefix + f"GOROOT={run.GUEST} ./standalone-go version")
              if "go version go1.27.2-hmos-devel openharmony/amd64" not in output:
                  raise run.Failure("standalone Go command did not start")
              for variant in ("", "standalone-"):
                  code, output = self.shell(variant + "disabled-control", prefix + f"GODEBUG=asyncpreemptoff=1 timeout -s KILL 5 ./{variant}testprog AsyncPreempt", check=False)
                  if code not in (124, 137) or "OK" in output:
                      raise run.Failure(variant + "disabled preemption did not time out")
                  for i in range(10):
                      _, output = self.shell(f"{variant}async-preempt-{i}", prefix + f"timeout -s KILL 30 ./{variant}testprog AsyncPreempt")
                      if "OK" not in output.splitlines():
                          raise run.Failure(variant + "AsyncPreempt did not complete")
                  for program in ("GCFairness", "GCFairness2"):
                      _, output = self.shell(variant + program, prefix + f"timeout -s KILL 30 ./{variant}testprog {program}")
                      if "OK" not in output.splitlines():
                          raise run.Failure(variant + program + " did not complete")
                  _, output = self.shell(variant + "runtime-policy", prefix + f"./{variant}runtime.test -test.v -test.timeout=60s -test.run='^(TestPreemption|TestOpenHarmonyRuntimePolicy|TestOpenHarmonySynchronousFault|TestOpenHarmonyMadvDontNeedDefault)$'")
                  if "PASS" not in output.splitlines() or "--- SKIP" in output:
                      raise run.Failure(variant + "runtime tests did not pass")
              _, output = self.shell("dlopen", prefix + "./loader ./libgo_hmos_test.so --no-network")
              if "PASS: dlopen" not in output:
                  raise run.Failure("c-shared callbacks failed")
              self.record("standalone-pass", core="129dd94577dbfc130e921acd417d551e5586e82a")

          run.Runner.test = check
          run.Runner(os.environ["EMULATOR_ROOT"], "emulator-diagnostics").boot("openharmony-out/amd64")
          PY
          sudo -E env HOME="$HOME" USER="$USER" LOGNAME="$LOGNAME" setpriv --reuid="$(id -u)" --regid="$(getent group kvm | cut -d: -f3)" \
            --init-groups --inh-caps=-all --bounding-set=-all python3 scripts/emulator/preempt-check.py
          printf 'PASS: upstream AsyncPreempt and GC fairness on HarmonyOS x64 at core %s.\n' \
            "$(cat openharmony-out/amd64/source-revision.txt)" >> "$GITHUB_STEP_SUMMARY"
      - name: Record exact revisions and retain diagnostics
        if: always()
        run: |
          mkdir -p emulator-diagnostics
          git rev-parse HEAD > emulator-diagnostics/build-revision.txt
          if test -d source/.git; then
            git -C source rev-parse HEAD > emulator-diagnostics/core-revision.txt
          fi
          df -h > emulator-diagnostics/disk.txt
      - name: Upload test logs and cross-compiled payload only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: harmonyos-amd64-runtime-${{ github.sha }}
          path: |
            emulator-diagnostics/
            openharmony-out/amd64/
            openharmony-out/arm64/
          if-no-files-found: warn
          retention-days: 7
